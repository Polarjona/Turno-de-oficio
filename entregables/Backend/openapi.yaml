      x-reglas: [RN-23]
      parameters:
        - {name: canal, in: query, schema: {$ref: '#/components/schemas/CanalNotificacion'}}
        - {name: estado, in: query, schema: {type: string, enum: [pendiente, enviada, entregada, leida, fallida]}}
        - {name: solo_no_leidas, in: query, schema: {type: boolean, default: false}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de notificaciones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Notificacion'}}

  /notificaciones/{notificacionId}/lectura:
    parameters:
      - {name: notificacionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Notificaciones]
      operationId: marcarLeida
      summary: Marca leída y deja constancia
      security: [{oauth2: [turno.write]}]
      x-roles: [letrado, coordinacion, admin]
      x-reglas: [RN-11, RN-20]
      responses:
        '200':
          description: Notificación leída
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notificacion'}
        '404': {$ref: '#/components/responses/NoEncontrado'}

  /auditoria:
    get:
      tags: [Auditoría]
      operationId: consultarAuditoria
      summary: Registro inmutable de cambios (RN-20)
      description: |
        Solo lectura: no existe endpoint de escritura ni de borrado, y ningún rol tiene
        permiso de `UPDATE` o `DELETE` sobre la tabla.
      security: [{oauth2: [auditoria.read]}]
      x-roles: [coordinacion, junta, admin]
      x-reglas: [RN-20, RN-33]
      parameters:
        - {name: entidad, in: query, schema: {type: string, enum: [guardia, solicitud, cuadrante, parte, disponibilidad, usuario]}}
        - {name: entidad_id, in: query, schema: {type: string, format: uuid}}
        - {name: actor_id, in: query, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de asientos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      data: {type: array, items: {$ref: '#/components/schemas/EventoAuditoria'}}
        '403': {$ref: '#/components/responses/SinPermiso'}

  /informes/certificacion:
    get:
      tags: [Control]
      operationId: obtenerCertificacion
      summary: Certificación del periodo con partes validados (RN-19)
      description: Solo cuenta lo validado. Un parte sin validar no entra en la cifra.
      security: [{oauth2: [panel.read]}]
      x-roles: [coordinacion, junta, admin]
      x-reglas: [RN-19]
      parameters:
        - {name: anio, in: query, required: true, schema: {type: integer}}
        - {name: periodo, in: query, required: true, schema: {type: string}, example: '12'}
      responses:
        '200':
          description: Certificación
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Certificacion'}
        '409': {$ref: '#/components/responses/Conflicto'}

  /designaciones-urgentes:
    post:
      tags: [Guardias]
      operationId: designarUrgente
      summary: Designación urgente fuera del ciclo ordinario (RN-39)
      description: |
        Para detenido en dependencias policiales, requerimiento inmediato o
        indisponibilidad sobrevenida. Registra origen, autoridad y hora exacta, y exige
        motivo si se aparta del criterio de equidad.
      security: [{oauth2: [turno.write]}]
      x-roles: [coordinacion, admin]
      x-reglas: [RN-08, RN-29, RN-39]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guardia_id, abogado_id, autoridad_id, motivo_codigo]
              properties:
                guardia_id: {type: string, format: uuid}
                abogado_id: {type: string, format: uuid}
                autoridad_id: {type: string, format: uuid}
                motivo_codigo: {type: string, enum: [detenido, requerimiento_judicial, indisponibilidad_sobrevenida, violencia_genero]}
                detalle: {type: string, maxLength: 1000}
                registrada_en: {type: string, format: date-time, description: Hora exacta del requerimiento}
      responses:
        '201':
          description: Designación urgente registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DesignacionResponse'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/ReglaIncumplida'}

  /designaciones-manuales:
    post:
      tags: [Guardias]
      operationId: registrarDesignacionManual
      summary: Registra una designación hecha fuera del sistema (RN-28, RN-29)
      description: |
        Para cuando la plataforma no está disponible y la guardia se cubre por teléfono.
        No crea la designación: la documenta con autoridad, hora exacta y causa, y la
        incorpora al expediente. Sin este registro, una designación manual es un hueco
        inexplicable en la trazabilidad.
      security: [{oauth2: [turno.write]}]
      x-roles: [coordinacion, admin]
      x-reglas: [RN-28, RN-29]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guardia_id, abogado_id, autoridad_id, ocurrida_en, causa]
              properties:
                guardia_id: {type: string, format: uuid}
                abogado_id: {type: string, format: uuid}
                autoridad_id: {type: string, format: uuid}
                ocurrida_en: {type: string, format: date-time, description: Hora exacta en que se hizo la designación}
                causa: {type: string, maxLength: 1000}
      responses:
        '201':
          description: Designación manual registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DesignacionResponse'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/ReglaIncumplida'}

  /solicitudes/{solicitudId}/justificante:
    parameters:
      - $ref: '#/components/parameters/SolicitudId'
    get:
      tags: [Solicitudes]
      operationId: obtenerJustificante
      summary: Justificante de la solicitud, solo para roles autorizados (RN-24)
      description: |
        Cada acceso queda registrado en auditoría. El contenido no viaja en las
        notificaciones: el aviso solo indica que hay una novedad (RN-23).
      security: [{oauth2: [solicitud.resolve]}]
      x-roles: [coordinacion, junta]
      x-reglas: [RN-23, RN-24]
      responses:
        '200':
          description: Documento justificativo
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '404': {$ref: '#/components/responses/NoEncontrado'}

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: SSO colegial con JWT; los scopes se asignan por rol
      flows:
        authorizationCode:
          authorizationUrl: https://sso.example/oauth2/authorize
          tokenUrl: https://sso.example/oauth2/token
          scopes:
            turno.read: Consultar guardias, catálogos y disponibilidad
            turno.write: Designar, acusar, anular, reforzar, registrar incidencias
            solicitud.create: Presentar excusas, permutas y responder ofertas
            solicitud.resolve: Resolver solicitudes
            cuadrante.read: Consultar cuadrante y versiones
            cuadrante.publish: Publicar y modificar el cuadrante
            parte.validate: Validar partes de guardia
            panel.read: Panel de control y certificación
            auditoria.read: Consultar auditoría

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devuelto en `page.next_cursor`
      schema: {type: string, maxLength: 512}
    Limite:
      name: limit
      in: query
      description: Tamaño de página
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Desde:
      name: desde
      in: query
      description: Fecha inicial inclusive
      schema: {type: string, format: date}
    Hasta:
      name: hasta
      in: query
      description: Fecha final inclusive
      schema: {type: string, format: date}
    GuardiaId:
      name: guardiaId
      in: path
      required: true
      description: Identificador inmutable de la guardia (RN-32)
      schema: {type: string, format: uuid}
    SolicitudId:
      name: solicitudId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Anio:
      name: anio
      in: path
      required: true
      schema: {type: integer, minimum: 2024, maximum: 2100}
    Periodo:
      name: periodo
      in: path
      required: true
      description: Mes con dos dígitos
      schema: {type: string, pattern: '^(0[1-9]|1[0-2])$'}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag del cuadrante leído; evita pisar cambios ajenos
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clave única del intento; el reintento devuelve la misma respuesta
      schema: {type: string, minLength: 16, maxLength: 128}

  headers:
    ETag:
      description: Versión del recurso
      schema: {type: string}
    Location:
      description: URI del recurso creado
      schema: {type: string, format: uri}
    XTotalEstimado:
      description: Estimación del total, no exacta
      schema: {type: integer}
    IdempotencyReplayed:
      description: |
        Presente y a `true` cuando la respuesta reproduce un intento anterior con la misma
        `Idempotency-Key`, en lugar de ejecutar la operación otra vez.
      schema: {type: boolean}

  responses:
    NoAutenticado:
      description: Falta el token o está caducado
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tof.example/errores/no-autenticado
            title: Autenticación requerida
            status: 401
            code: NO_AUTENTICADO
    SinPermiso:
      description: El rol no alcanza esta operación
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tof.example/errores/sin-permiso
            title: El rol no permite esta acción
            status: 403
            code: SIN_PERMISO
            detail: Un proceso automático no puede estimar ni desestimar una excusa.
            regla: RN-37
    NoEncontrado:
      description: El recurso no existe o no es visible para el rol
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tof.example/errores/no-encontrado
            title: Recurso no encontrado
            status: 404
            code: NO_ENCONTRADO
    PeticionInvalida:
      description: Parámetros o cuerpo mal formados
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tof.example/errores/validacion
            title: Petición inválida
            status: 400
            code: VALIDACION
            errores:
              - campo: hora_fin
                mensaje: Formato esperado HH:MM
                codigo: FORMATO
    Conflicto:
      description: El recurso no admite esta transición en su estado actual
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tof.example/errores/conflicto
            title: Transición no permitida
            status: 409
            code: CONFLICTO_ESTADO
            detail: La guardia está en estado Planificada y no admite acuse.
            regla: RN-10
    ReglaIncumplida:
      description: Regla de negocio incumplida con el dato que la incumple
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tof.example/errores/regla
            title: Regla de negocio incumplida
            status: 422
            code: REGLA_NEGOCIO
            regla: RN-06
            detail: El letrado ha alcanzado el cupo mensual de 6 guardias.
    VersionDesactualizada:
      description: El `If-Match` no coincide con la versión vigente
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tof.example/errores/version
            title: El cuadrante ha cambiado
            status: 412
            code: VERSION_DESACTUALIZADA
            detail: La versión vigente es la 4; se intentó publicar sobre la 3.

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      description: |
        Formato de error RFC 9457. `code` es estable y sirve para ramificar en el cliente;
        `regla` aparece cuando el rechazo nace de una regla del catálogo.
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code:
          type: string
          enum: [VALIDACION, NO_AUTENTICADO, SIN_PERMISO, NO_ENCONTRADO, CONFLICTO_ESTADO, REGLA_NEGOCIO, VERSION_DESACTUALIZADA]
        regla: {type: string, pattern: '^RN-[0-9]{2}$'}
        errores:
          type: array
          items:
            type: object
            properties:
              campo: {type: string}
              mensaje: {type: string}
              codigo: {type: string}
        franjas_afectadas:
          type: array
          items:
            type: object
            properties:
              guardia_id: {type: string, format: uuid}
              fecha: {type: string, format: date}
              motivo: {type: string}
        candidatos_rechazados:
          type: array
          description: Candidatos que no superaron los siete filtros (RN-14)
          items:
            type: object
            properties:
              abogado_id: {type: string, format: uuid}
              filtro: {type: string}
              regla: {type: string, pattern: '^RN-[0-9]{2}$'}

    Pagina:
      type: object
      required: [data, page]
      properties:
        data: {type: array, items: {}}
        page:
          type: object
          required: [has_more]
          properties:
            next_cursor: {type: string, nullable: true}
            has_more: {type: boolean}
            size: {type: integer}

    EstadoGuardia:
      type: string
      enum: [planificada, propuesta, publicada, confirmada, en_revision, descubierta, en_curso, realizada, validada, anulada]

    EstadoCuadrante:
      type: string
      enum: [borrador, en_alegaciones, publicado, congelado, cerrado]

    EstadoSolicitud:
      type: string
      enum: [comunicada, en_revision, oferta_enviada, pendiente_validacion, estimada, desestimada]

    CanalNotificacion:
      type: string
      enum: [app, email, sms, push]
      description: |
        La aplicación es el canal principal; correo y push son refuerzos y no sustituyen
        al registro interno.

    CatalogoItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        codigo: {type: string}
        nombre: {type: string}
        activo: {type: boolean}

    TipoGuardia:
      type: object
      properties:
        id: {type: string, format: uuid}
        codigo: {type: string, example: PEN-24H}
        especialidad_id: {type: string, format: uuid}
        modalidad: {type: string, enum: [presencial, localizada, mixta]}
        hora_inicio: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        hora_fin: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        cruza_medianoche: {type: boolean}
        letrados_previstos: {type: integer}
        peso_computo: {type: number, format: double, description: Peso de la plantilla en el cómputo de equidad}
        descanso_posterior_h: {type: integer, nullable: true}
        es_detenido: {type: boolean, description: Franja de asistencia al detenido de 24 h (RN-35)}

    Parametro:
      type: object
      properties:
        clave: {type: string, example: cupo_mensual}
        valor: {description: Valor tipado según la clave}
        tipo: {type: string, enum: [entero, decimal, texto, booleano]}
        vigente_desde: {type: string, format: date}
        vigente_hasta: {type: string, format: date, nullable: true}
        version: {type: integer}
        acuerdo: {type: string, description: Referencia del acuerdo de Junta que lo aprueba}

    CriterioReparto:
      type: object
      properties:
        version: {type: integer}
        acuerdo_fecha: {type: string, format: date}
        pesos:
          type: array
          items:
            type: object
            properties:
              tipo_guardia_codigo: {type: string}
              peso: {type: number, format: double}
        cupos:
          type: object
          properties:
            mes: {type: integer}
            trimestre: {type: integer}
            anio: {type: integer}
        plazos:
          type: object
          properties:
            excusa_dias_habiles: {type: integer}
            resolucion_dias: {type: integer}
            publicacion_dias_antelacion: {type: integer}
            cierre_disponibilidad_dias: {type: integer}
        orden_prelacion:
          type: array
          items: {type: string}
          description: Cascada de desempate aplicada cuando el cómputo empata
        semilla_publicada: {type: boolean}

    Perfil:
      type: object
      properties:
        usuario_id: {type: string, format: uuid}
        nombre: {type: string}
        apellidos: {type: string}
        email: {type: string, format: email}
        rol: {type: string, enum: [letrado, coordinacion, junta, admin]}
        abogado:
          type: object
          nullable: true
          properties:
            id: {type: string, format: uuid}
            num_colegiado: {type: string}
            orden_turno: {type: integer}
            zona: {type: string}
            activo: {type: boolean}
        habilitaciones:
          type: array
          items:
            type: object
            properties:
              especialidad_codigo: {type: string}
              estado: {type: string, enum: [vigente, caducada, suspendida]}
              caducidad: {type: string, format: date, nullable: true}

    TitularResumen:
      type: object
      description: |
        Proyección mínima del titular para el rol letrado: nombre y materia, nada más
        (RN-25). La coordinación recibe el objeto completo.
      properties:
        abogado_id: {type: string, format: uuid}
        nombre: {type: string}
        especialidad_codigo: {type: string}

    Guardia:
      type: object
      required: [id, tipo_guardia_id, especialidad_id, fecha, hora_inicio, hora_fin, estado, version]
      properties:
        id: {type: string, format: uuid}
        cuadrante_id: {type: string, format: uuid, nullable: true}
        tipo_guardia_id: {type: string, format: uuid}
        especialidad_id: {type: string, format: uuid}
        abogado_id: {type: string, format: uuid, nullable: true, description: Titular efectivo; nulo en planificada y descubierta}
        fecha: {type: string, format: date}
        hora_inicio: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        hora_fin: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        estado: {$ref: '#/components/schemas/EstadoGuardia'}
        origen: {type: string, enum: [planificacion, manual, urgente, refuerzo, cobertura_hueco]}
        motivo_asignacion: {type: string, nullable: true}
        es_detenido: {type: boolean}
        titular: {$ref: '#/components/schemas/TitularResumen'}
        version: {type: integer}
        creado_en: {type: string, format: date-time}
        modificado_en: {type: string, format: date-time}

    GuardiaRequest:
      type: object
      required: [tipo_guardia_id, especialidad_id, fecha, hora_inicio, hora_fin]
      properties:
        tipo_guardia_id: {type: string, format: uuid}
        especialidad_id: {type: string, format: uuid}
        fecha: {type: string, format: date}
        hora_inicio: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        hora_fin: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        es_detenido: {type: boolean, default: false}

    Propuesta:
      type: object
      properties:
        guardia_id: {type: string, format: uuid}
        generada_en: {type: string, format: date-time}
        semilla: {type: string, description: Semilla del desempate, reproducible}
        candidatos:
          type: array
          items:
            type: object
            properties:
              abogado_id: {type: string, format: uuid}
              nombre: {type: string}
              computo_periodo: {type: number, format: double}
              guardias_ultimo_mes: {type: integer}
              excusas_estimadas: {type: integer}
              orden: {type: integer}
              criterio_desempate: {type: string}
        descartes:
          type: array
          items:
            type: object
            properties:
              abogado_id: {type: string, format: uuid}
              filtro: {type: string, enum: [alta_turno, habilitacion, disponibilidad, solapamiento, descanso, cupo, exclusion]}
              regla: {type: string, pattern: '^RN-[0-9]{2}$'}
              detalle: {type: string}

    DesignacionRequest:
      type: object
      required: [abogado_id]
      properties:
        abogado_id: {type: string, format: uuid}
        aparta_criterio: {type: boolean, default: false, description: Si es true, el motivo es obligatorio (RN-08)}
        motivo_codigo: {type: string, enum: [continuidad, conocimiento_asunto, indicacion_juzgado, situacion_excepcional]}
        detalle: {type: string, maxLength: 1000}
        semilla: {type: string}

    DesignacionResponse:
      type: object
      properties:
        guardia: {$ref: '#/components/schemas/Guardia'}
        origen: {type: string, enum: [planificacion, manual, urgente, refuerzo, cobertura_hueco]}
        motivo_codigo: {type: string, nullable: true}
        autoridad_id: {type: string, format: uuid, nullable: true}
        registrada_en: {type: string, format: date-time}
        auditoria_id: {type: string, format: uuid}

    Incidencia:
      type: object
      properties:
        id: {type: string, format: uuid}
        guardia_id: {type: string, format: uuid}
        categoria: {type: string, enum: [ausencia, retraso, imposibilidad, material, acceso, otra]}
        gravedad: {type: string, enum: [baja, media, alta]}
        descripcion: {type: string}
        abierta_por: {type: string, format: uuid}
        fecha_apertura: {type: string, format: date-time}
        estado_guardia: {$ref: '#/components/schemas/EstadoGuardia'}
        escalado: {type: boolean}

    Parte:
      type: object
      properties:
        guardia_id: {type: string, format: uuid}
        estado: {type: string, enum: [sin_parte, abierto, cerrado, validado]}
        hora_entrada: {type: string, format: date-time, nullable: true}
        hora_salida: {type: string, format: date-time, nullable: true}
        actuaciones: {type: string, nullable: true}
        incidencias: {type: string, nullable: true}
        cerrado_en: {type: string, format: date-time, nullable: true}
        validado_por: {type: string, format: uuid, nullable: true}
