openapi: 3.0.3

info:
  title: Turno de Oficio · Contrato de API
  version: 0.1.0
  description: |
    Contrato entre frontend y backend para la gestión del Turno de Oficio (ejercicio TOF).
    Tarjeta #29 · Backend · Yazan. Documento de trabajo: **v0.1**, sujeto a revisión en
    la tarjeta #47 (stack) y a los casos de uso de la #22 y la #42.

    **Alcance.** Guardias, designaciones, sustituciones, cuadrante, disponibilidad, panel,
    notificaciones y auditoría. Queda fuera la elección de tecnología.

    **Convenciones**

    - Los nombres de campo son los del modelo del cap. 21 de TOF-2026-001, en `snake_case`.
      No se traduce el modelo al JSON: una traducción de nombres es una fuente de errores
      que nadie mantiene.
    - Identificadores UUID opacos. El de una guardia **no cambia nunca**, aunque cambie de
      titular (RN-32): los cambios de titular son designaciones nuevas.
    - Listados con **paginación por cursor** (`cursor`, `limit`), nunca por `offset`: el
      cuadrante se mueve mientras se pagina.
    - Errores en `application/problem+json` (RFC 9457) con `code` de máquina y `regla`
      (`RN-xx`) cuando el rechazo nace de una regla del catálogo #21 v0.2.
    - Los cambios de estado son **acciones explícitas** (`POST .../publicacion`), no
      `PATCH {estado}`: así cada transición tiene su regla, su permiso y su asiento.
    - Toda operación que crea o mueve algo acepta `Idempotency-Key`; el reintento seguro
      devuelve la misma respuesta con `Idempotency-Replayed: true`.
    - El cuadrante viaja con `ETag`. Publicar exige `If-Match`: si el cuadrante cambió
      desde que se leyó, `412` en vez de pisar cambios ajenos.
    - Fechas ISO 8601 (`date`, `date-time`) en zona `Europe/Madrid`.

    **Autorización.** OAuth2 (SSO colegial) con JWT. Cuatro roles: `letrado`,
    `coordinacion`, `junta`, `admin`. Cada operación declara su scope y los roles
    admitidos en `x-roles`. El backend comprueba el rol, no el frontend.

    **Proyección de datos (RN-25).** El rol `letrado` solo ve de sus compañeros el nombre
    y la materia de la guardia. El esquema `TitularResumen` documenta esa proyección: el
    resto de campos se omiten en la respuesta, no se ocultan en el cliente.

    **Trazabilidad.** Toda operación que cambia estado escribe un asiento de auditoría
    (RN-20). La auditoría es de solo lectura por API: no hay `POST`, `PUT` ni `DELETE`.

    **Revisión 2** (16 de noviembre de 2026). Atiende la revisión de la #29: endpoint de
    validación de disponibilidad (RN-03 era inalcanzable sin él), reaplicación de los siete
    filtros en las ofertas de sustitución, `exclusion_hasta` sin tilde, ejemplo de guardia
    corregido y vocabulario de errores sin códigos muertos.
  contact:
    name: Yazan Issa · Backend
    url: https://trello.com/c/zhEYgn8e

servers:
  - url: https://api.tof.example/api/v1
    description: Entorno de ejercicio (sin despliegue real)

tags:
  - name: Sesión
    description: Perfil y habilitaciones del usuario autenticado
  - name: Catálogos
    description: Especialidades, tipos de guardia, parámetros y criterios de reparto
  - name: Guardias
    description: Franjas de cobertura, propuesta asistida, designación y acuse
  - name: Parte
    description: Registro de actuaciones y validación
  - name: Solicitudes
    description: Excusa, permuta y sustitución
  - name: Cuadrante
    description: Versiones, alegaciones, publicación y congelación
  - name: Disponibilidad
    description: Ausencias comunicadas por el letrado
  - name: Control
    description: Panel de coordinación, equidad y certificación
  - name: Notificaciones
    description: Avisos con constancia de envío, entrega y lectura
  - name: Auditoría
    description: Registro inmutable de cambios

x-maquinas-estado:
  guardia:
    estados: [planificada, propuesta, publicada, confirmada, en_revision, descubierta, en_curso, realizada, validada, anulada]
    transiciones:
      - {desde: planificada, evento: asignar_titular, hasta: propuesta, endpoint: "POST /guardias/{guardiaId}/designaciones", reglas: [RN-02, RN-03, RN-04, RN-05, RN-06, RN-08]}
      - {desde: propuesta, evento: publicar_cuadrante, hasta: publicada, endpoint: "POST /cuadrantes/{anio}/{periodo}/publicacion", reglas: [RN-09, RN-21, RN-35]}
      - {desde: publicada, evento: acuse, hasta: confirmada, endpoint: "POST /guardias/{guardiaId}/acuse", reglas: [RN-10, RN-11]}
      - {desde: publicada, evento: solicitar_excusa_o_permuta, hasta: en_revision, endpoint: "POST /solicitudes", reglas: [RN-12, RN-13, RN-36, RN-38]}
      - {desde: confirmada, evento: solicitar_excusa_o_permuta, hasta: en_revision, endpoint: "POST /solicitudes", reglas: [RN-12, RN-13, RN-36, RN-38]}
      - {desde: en_revision, evento: resolver_estimando_con_sustituto, hasta: publicada, endpoint: "POST /solicitudes/{solicitudId}/resolucion", reglas: [RN-14, RN-15, RN-16, RN-21]}
      - {desde: en_revision, evento: resolver_estimando_sin_sustituto, hasta: descubierta, endpoint: "POST /solicitudes/{solicitudId}/resolucion", reglas: [RN-17]}
      - {desde: en_revision, evento: resolver_desestimando, hasta: publicada, endpoint: "POST /solicitudes/{solicitudId}/resolucion", reglas: [RN-13]}
      - {desde: publicada, evento: inicio_de_franja, hasta: en_curso, endpoint: "sistema", reglas: [RN-01]}
      - {desde: confirmada, evento: inicio_de_franja, hasta: en_curso, endpoint: "sistema", reglas: [RN-01]}
      - {desde: en_curso, evento: incidente_grave, hasta: descubierta, endpoint: "POST /guardias/{guardiaId}/incidencias", reglas: [RN-17]}
      - {desde: en_curso, evento: cierre_parte, hasta: realizada, endpoint: "PUT /guardias/{guardiaId}/parte", reglas: [RN-18]}
      - {desde: realizada, evento: validar_parte, hasta: validada, endpoint: "POST /guardias/{guardiaId}/parte/validacion", reglas: [RN-19]}
      - {desde: publicada, evento: anular, hasta: anulada, endpoint: "POST /guardias/{guardiaId}/anulacion", reglas: [RN-31]}
      - {desde: confirmada, evento: anular, hasta: anulada, endpoint: "POST /guardias/{guardiaId}/anulacion", reglas: [RN-31]}
      - {desde: descubierta, evento: anular, hasta: anulada, endpoint: "POST /guardias/{guardiaId}/anulacion", reglas: [RN-31]}
  cuadrante:
    estados: [borrador, en_alegaciones, publicado, congelado, cerrado]
    transiciones:
      - {desde: borrador, evento: abrir_alegaciones, hasta: en_alegaciones, endpoint: "POST /cuadrantes/{anio}/{periodo}/alegaciones", reglas: [RN-22]}
      - {desde: en_alegaciones, evento: publicar, hasta: publicado, endpoint: "POST /cuadrantes/{anio}/{periodo}/publicacion", reglas: [RN-09, RN-21, RN-35]}
      - {desde: publicado, evento: modificar, hasta: publicado, endpoint: "POST /cuadrantes/{anio}/{periodo}/publicacion", reglas: [RN-21, RN-22]}
      - {desde: publicado, evento: alcanzar_antelacion_minima, hasta: congelado, endpoint: "sistema", reglas: [RN-27]}
      - {desde: congelado, evento: cerrar_periodo, hasta: cerrado, endpoint: "sistema", reglas: [RN-19]}
  solicitud:
    estados: [comunicada, en_revision, oferta_enviada, pendiente_validacion, estimada, desestimada]
    transiciones:
      - {desde: comunicada, evento: plazo_y_documentacion_ok, hasta: en_revision, endpoint: "sistema", reglas: [RN-12, RN-38]}
      - {desde: en_revision, evento: ofrecer_a_candidato, hasta: oferta_enviada, endpoint: "POST /solicitudes/{solicitudId}/ofertas", reglas: [RN-14]}
      - {desde: oferta_enviada, evento: candidato_acepta, hasta: pendiente_validacion, endpoint: "POST /solicitudes/{solicitudId}/ofertas/{ofertaId}/respuesta", reglas: [RN-14, RN-15]}
      - {desde: pendiente_validacion, evento: resolver, hasta: estimada, endpoint: "POST /solicitudes/{solicitudId}/resolucion", reglas: [RN-15, RN-16, RN-37]}
      - {desde: pendiente_validacion, evento: resolver, hasta: desestimada, endpoint: "POST /solicitudes/{solicitudId}/resolucion", reglas: [RN-37]}
  parte:
    estados: [sin_parte, abierto, cerrado, validado]
    transiciones:
      - {desde: sin_parte, evento: inicio_de_franja, hasta: abierto, endpoint: "sistema", reglas: []}
      - {desde: abierto, evento: cierre_por_letrado, hasta: cerrado, endpoint: "PUT /guardias/{guardiaId}/parte", reglas: [RN-18]}
      - {desde: cerrado, evento: validacion_coordinacion, hasta: validado, endpoint: "POST /guardias/{guardiaId}/parte/validacion", reglas: [RN-19]}

paths:
  /me:
    get:
      tags: [Sesión]
      operationId: obtenerPerfil
      summary: Perfil, rol y habilitaciones del usuario autenticado
      security: [{oauth2: [turno.read]}]
      x-roles: [letrado, coordinacion, junta, admin]
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Perfil'}
        '401': {$ref: '#/components/responses/NoAutenticado'}

  /catalogos/especialidades:
    get:
      tags: [Catálogos]
      operationId: listarEspecialidades
      summary: Materias del turno
      security: [{oauth2: [turno.read]}]
      x-roles: [letrado, coordinacion, junta, admin]
      parameters:
        - {name: solo_activas, in: query, schema: {type: boolean, default: true}}
      responses:
        '200':
          description: Lista de especialidades
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CatalogoItem'}
        '401': {$ref: '#/components/responses/NoAutenticado'}

  /catalogos/tipos-guardia:
    get:
      tags: [Catálogos]
      operationId: listarTiposGuardia
      summary: Plantillas de guardia con modalidad y peso de cómputo
      security: [{oauth2: [turno.read]}]
      x-roles: [letrado, coordinacion, junta, admin]
      parameters:
        - {name: especialidad_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Lista de tipos de guardia
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TipoGuardia'}
        '401': {$ref: '#/components/responses/NoAutenticado'}

  /parametros:
    get:
      tags: [Catálogos]
      operationId: listarParametros
      summary: Parámetros versionados con su vigencia (RN-27)
      description: |
        Nunca se sobrescribe un valor: se cierra su vigencia y se abre otra. `vigente_en`
        permite reconstruir qué criterio se aplicó a un periodo pasado.
      security: [{oauth2: [turno.read]}]
      x-roles: [coordinacion, junta, admin]
      x-reglas: [RN-27]
      parameters:
        - {name: clave, in: query, schema: {type: string}, example: cupo_mensual}
        - {name: vigente_en, in: query, schema: {type: string, format: date}, description: Fecha para la que se quiere el valor vigente}
      responses:
        '200':
          description: Parámetros con histórico
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Parametro'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/SinPermiso'}

  /criterios-reparto:
    get:
      tags: [Catálogos]
      operationId: obtenerCriteriosReparto
      summary: Criterios, pesos y cupos vigentes, públicos para todo el turno (RN-26)
      security: [{oauth2: [turno.read]}]
      x-roles: [letrado, coordinacion, junta, admin]
      x-reglas: [RN-26, RN-27]
      responses:
        '200':
          description: Criterios vigentes con fecha del acuerdo que los aprobó
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CriterioReparto'}
        '401': {$ref: '#/components/responses/NoAutenticado'}

  /guardias:
    get:
      tags: [Guardias]
      operationId: listarGuardias
      summary: Guardias del periodo con filtros
      security: [{oauth2: [turno.read]}]
      x-roles: [letrado, coordinacion, junta, admin]
      parameters:
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - {name: estado, in: query, style: form, explode: true, schema: {type: array, items: {$ref: '#/components/schemas/EstadoGuardia'}}}
        - {name: especialidad_id, in: query, schema: {type: string, format: uuid}}
        - {name: tipo_guardia_id, in: query, schema: {type: string, format: uuid}}
        - {name: abogado_id, in: query, schema: {type: string, format: uuid}, description: Si no se indica y el rol es letrado, se fuerza al propio}
        - {name: solo_descubiertas, in: query, schema: {type: boolean, default: false}}
        - {name: solo_detenido, in: query, schema: {type: boolean, default: false}, description: Franjas de asistencia al detenido (RN-35)}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
        - {name: orden, in: query, schema: {type: string, enum: [fecha_asc, fecha_desc], default: fecha_asc}}
      responses:
        '200':
          description: Página de guardias
          headers:
            X-Total-Estimado: {$ref: '#/components/headers/XTotalEstimado'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Guardia'}}
        '400': {$ref: '#/components/responses/PeticionInvalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
    post:
      tags: [Guardias]
      operationId: crearGuardia
      summary: Crea una franja sin titular (estado planificada)
      security: [{oauth2: [turno.write]}]
      x-roles: [coordinacion, admin]
      x-reglas: [RN-01, RN-32, RN-35]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GuardiaRequest'}
            example:
              tipo_guardia_id: 9f1c2f7a-8f3b-4a1e-9d2b-1c6a0b5e7d31
              especialidad_id: 3a7d1e42-5c88-4b0f-8f0a-2d9e6c1b4a55
              fecha: '2026-12-03'
              hora_inicio: '09:00'
              hora_fin: '20:00'
              es_detenido: false
      responses:
        '201':
          description: Guardia creada en estado planificada
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Guardia'}
        '400': {$ref: '#/components/responses/PeticionInvalida'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '409': {$ref: '#/components/responses/Conflicto'}

  /guardias/{guardiaId}:
    parameters:
      - $ref: '#/components/parameters/GuardiaId'
    get:
      tags: [Guardias]
      operationId: obtenerGuardia
      summary: Detalle de una guardia
      security: [{oauth2: [turno.read]}]
      x-roles: [letrado, coordinacion, junta, admin]
      x-reglas: [RN-25, RN-32]
      responses:
        '200':
          description: Guardia
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Guardia'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '404': {$ref: '#/components/responses/NoEncontrado'}

  /guardias/{guardiaId}/propuesta:
    parameters:
      - $ref: '#/components/parameters/GuardiaId'
    get:
      tags: [Guardias]
      operationId: calcularPropuesta
      summary: Propuesta asistida con los siete filtros y el orden de prelación
      description: |
        Calcula y devuelve, no escribe: no crea designaciones ni notifica (RN-07). Cada
        descarte viaja con el filtro que lo produjo, para poder explicar por qué una
        persona concreta no salió propuesta.
      security: [{oauth2: [turno.read]}]
      x-roles: [coordinacion, admin]
      x-reglas: [RN-02, RN-03, RN-04, RN-05, RN-06, RN-07, RN-08]
      parameters:
        - {name: semilla, in: query, schema: {type: string}, description: Semilla reproducible del desempate; si falta, la genera el servidor y la devuelve}
      responses:
        '200':
          description: Candidatos ordenados y descartes motivados
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Propuesta'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '409': {$ref: '#/components/responses/Conflicto'}

  /guardias/{guardiaId}/designaciones:
    parameters:
      - $ref: '#/components/parameters/GuardiaId'
    post:
      tags: [Guardias]
      operationId: designarTitular
      summary: Designa titular y pasa la guardia a propuesta
      description: |
        Aplica los siete filtros dentro de la misma transacción de asignación. Si la
        designación se aparta de la propuesta, exige motivo tipificado (RN-08).
      security: [{oauth2: [turno.write]}]
      x-roles: [coordinacion, admin]
      x-reglas: [RN-02, RN-03, RN-04, RN-05, RN-06, RN-08, RN-29, RN-32]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DesignacionRequest'}
            example:
              abogado_id: c1a0d8b2-3e58-4a9f-9f0d-6b7e2c4d1a83
              aparta_criterio: true
              motivo_codigo: conocimiento_asunto
              detalle: Designación solicitada por el juzgado de instrucción 2
              semilla: prop-2026-12-03-penal
      responses:
        '201':
          description: Designación registrada
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DesignacionResponse'}
        '400': {$ref: '#/components/responses/PeticionInvalida'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '409':
          description: |
            La guardia no admite la transición, o el letrado no supera uno de los filtros.
            El problema indica la regla incumplida.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.tof.example/errores/regla
                title: El letrado tiene otra guardia solapada
                status: 409
                code: REGLA_NEGOCIO
                regla: RN-04
                detail: Ya cubre la franja de 09:00 a 09:00 del 3 de diciembre en penal.
                instance: /api/v1/guardias/7b2e9c14-0a6d-4c3b-9f51-2d8e7a1b6c40/designaciones

  /guardias/{guardiaId}/acuse:
    parameters:
      - $ref: '#/components/parameters/GuardiaId'
    post:
      tags: [Guardias]
      operationId: acusarRecibo
      summary: El letrado acusa recibo de la designación
      description: |
        El acuse no es condición de eficacia (RN-10): si no llega, el sistema recuerda y
        avisa a coordinación (RN-11), pero la designación sigue vigente.
      security: [{oauth2: [turno.write]}]
      x-roles: [letrado]
      x-reglas: [RN-10, RN-11]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canal]
              properties:
                canal: {$ref: '#/components/schemas/CanalNotificacion'}
      responses:
        '200':
          description: Acuse registrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Guardia'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '409': {$ref: '#/components/responses/Conflicto'}

  /guardias/{guardiaId}/anulacion:
    parameters:
      - $ref: '#/components/parameters/GuardiaId'
    post:
      tags: [Guardias]
      operationId: anularGuardia
      summary: Anula una franja con motivo y aviso a los afectados (RN-31)
      security: [{oauth2: [turno.write]}]
      x-roles: [coordinacion, admin]
      x-reglas: [RN-20, RN-31]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo_codigo, detalle]
              properties:
                motivo_codigo: {type: string, enum: [error_planificacion, decision_colegial, falta_cobertura, otro]}
                detalle: {type: string, maxLength: 1000}
      responses:
        '200':
          description: Guardia anulada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Guardia'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '409': {$ref: '#/components/responses/Conflicto'}

  /guardias/{guardiaId}/refuerzos:
    parameters:
      - $ref: '#/components/parameters/GuardiaId'
    post:
      tags: [Guardias]
      operationId: anadirRefuerzo
      summary: Añade un refuerzo sin cambiar al titular (RN-34)
      security: [{oauth2: [turno.write]}]
      x-roles: [coordinacion, admin]
      x-reglas: [RN-02, RN-34]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abogado_id, motivo_codigo]
              properties:
                abogado_id: {type: string, format: uuid}
                motivo_codigo: {type: string, enum: [acumulacion, complejidad, indicacion_judicial, otro]}
                detalle: {type: string, maxLength: 1000}
      responses:
        '201':
          description: Cobertura múltiple registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Guardia'}
        '409': {$ref: '#/components/responses/Conflicto'}

  /guardias/{guardiaId}/incidencias:
    parameters:
      - $ref: '#/components/parameters/GuardiaId'
    post:
      tags: [Guardias]
      operationId: registrarIncidencia
      summary: Registra una incidencia durante la guardia
      description: |
        Una incidencia de gravedad alta deja la franja descubierta y dispara la alerta de
        máxima prioridad (RN-17).
      security: [{oauth2: [turno.write]}]
      x-roles: [letrado, coordinacion, admin]
      x-reglas: [RN-17, RN-20]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoria, gravedad, descripcion]
              properties:
                categoria: {type: string, enum: [ausencia, retraso, imposibilidad, material, acceso, otra]}
