    put:
      tags: [Parte]
      operationId: guardarParte
      summary: Registra o cierra el parte
      description: |
        Cerrar exige hora de entrada, hora de salida y descripción de actuaciones
        (RN-18). Sin los tres, `422` con los campos que faltan.
      security: [{oauth2: [turno.write]}]
      x-roles: [letrado, coordinacion]
