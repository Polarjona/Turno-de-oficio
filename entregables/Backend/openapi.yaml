  /solicitudes:
    get:
      tags: [Solicitudes]
      operationId: listarSolicitudes
      summary: Excusas, permutas y sustituciones
      security: [{oauth2: [turno.read]}]
      x-roles: [letrado, coordinacion, junta, admin]
      parameters:
        - {name: estado, in: query, style: form, explode: true, schema: {type: array, items: {$ref: '#/components/schemas/EstadoSolicitud'}}}
        - {name: tipo, in: query, schema: {type: string, enum: [excusa, permuta, sustitucion]}}
        - {name: guardia_id, in: query, schema: {type: string, format: uuid}}
        - {name: solicitante_id, in: query, schema: {type: string, format: uuid}}
        - {name: solo_vencidas, in: query, schema: {type: boolean, default: false}, description: Plazo de resolución vencido (RN-38)}
        - {name: extemporanea, in: query, schema: {type: boolean}, description: Presentadas fuera de plazo (RN-12)}
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de solicitudes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Solicitud'}}
        '401': {$ref: '#/components/responses/NoAutenticado'}
    post:
      tags: [Solicitudes]
      operationId: crearSolicitud
      summary: Registra excusa, permuta o sustitución
      description: |
        La excusa solo se admite en el orden penal (RN-36): fuera de él, `422` con el
        fundamento legal. Registrarla **no libera al titular** hasta la resolución
        (RN-13). La extemporaneidad se registra, no se oculta (RN-12).
      security: [{oauth2: [solicitud.create]}]
      x-roles: [letrado]
      x-reglas: [RN-12, RN-13, RN-15, RN-36, RN-38]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SolicitudRequest'}
            example:
              guardia_id: 7b2e9c14-0a6d-4c3b-9f51-2d8e7a1b6c40
              tipo: excusa
              motivo: enfermedad
              detalle: Ingreso hospitalario documentado
              sobrevenida: false
      responses:
        '201':
          description: Solicitud registrada
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Solicitud'}
        '400': {$ref: '#/components/responses/PeticionInvalida'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422':
          description: Excusa fuera de plazo o materia no admitida
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.tof.example/errores/regla
                title: La excusa solo cabe en el orden penal
                status: 422
                code: REGLA_NEGOCIO
                regla: RN-36
                detail: La guardia es de extranjería; el art. 31 de la Ley 1/1996 no ampara la excusa en esta materia.
                instance: /api/v1/solicitudes

  /solicitudes/{solicitudId}:
    parameters:
      - $ref: '#/components/parameters/SolicitudId'
    get:
      tags: [Solicitudes]
      operationId: obtenerSolicitud
      summary: Expediente de la solicitud
      security: [{oauth2: [turno.read]}]
      x-roles: [letrado, coordinacion, junta, admin]
      x-reglas: [RN-25]
      responses:
        '200':
          description: Solicitud con su historial
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Solicitud'}
        '404': {$ref: '#/components/responses/NoEncontrado'}

  /solicitudes/{solicitudId}/ofertas:
    parameters:
      - $ref: '#/components/parameters/SolicitudId'
    post:
      tags: [Solicitudes]
      operationId: ofrecerSustitucion
      summary: Abre la bolsa y ofrece a los candidatos elegibles
      description: |
        El cliente nomina, el servidor valida. Los candidatos del cuerpo se vuelven a
        comprobar contra los siete filtros antes de crear ninguna oferta (RN-14): si uno
        no los supera, no se crea ninguna y la petición se rechaza entera con `422`,
        devolviendo en `candidatos_rechazados` el filtro que descartó a cada uno. Nombrar
        a un letrado sin habilitación no puede depender de que el frontend se acuerde.
        Si no queda ningún candidato viable, la solicitud sigue en revisión y la guardia
        puede pasar a descubierta provisional.
      security: [{oauth2: [solicitud.resolve]}]
      x-roles: [coordinacion, admin]
      x-reglas: [RN-14, RN-15]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidatos]
              properties:
                candidatos:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {type: string, format: uuid}
                plazo_respuesta_horas: {type: integer, minimum: 1, maximum: 72, default: 4}
      responses:
        '201':
          description: Ofertas creadas
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Oferta'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/ReglaIncumplida'}

  /solicitudes/{solicitudId}/ofertas/{ofertaId}/respuesta:
    parameters:
      - $ref: '#/components/parameters/SolicitudId'
      - {name: ofertaId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Solicitudes]
      operationId: responderOferta
      summary: El candidato acepta o rechaza la oferta
      security: [{oauth2: [solicitud.create]}]
      x-roles: [letrado]
      x-reglas: [RN-14, RN-15]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuesta]
              properties:
                respuesta: {type: string, enum: [aceptar, rechazar]}
      responses:
        '200':
          description: Respuesta registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  oferta: {$ref: '#/components/schemas/Oferta'}
                  solicitud: {$ref: '#/components/schemas/Solicitud'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '409': {$ref: '#/components/responses/Conflicto'}

  /solicitudes/{solicitudId}/resolucion:
    parameters:
      - $ref: '#/components/parameters/SolicitudId'
    post:
      tags: [Solicitudes]
      operationId: resolverSolicitud
      summary: Resuelve la solicitud; solo un rol humano (RN-37)
      description: |
        Estimar con sustituto cambia el titular y genera versión nueva del cuadrante
        (RN-21). Estimar sin sustituto deja la guardia descubierta (RN-17). Desestimar
        devuelve la guardia al titular con motivación (RN-13). Ningún proceso automático
        puede escribir esta transición (RN-37).
      security: [{oauth2: [solicitud.resolve]}]
      x-roles: [coordinacion, junta, admin]
      x-reglas: [RN-13, RN-15, RN-16, RN-17, RN-21, RN-37, RN-38]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolucionRequest'}
      responses:
        '200':
          description: Solicitud resuelta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Solicitud'}
        '403': {$ref: '#/components/responses/SinPermiso'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '412': {$ref: '#/components/responses/VersionDesactualizada'}
        '422': {$ref: '#/components/responses/ReglaIncumplida'}

  /cuadrantes:
