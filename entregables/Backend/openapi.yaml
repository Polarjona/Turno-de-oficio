            application/json:
              schema: {$ref: '#/components/schemas/Parte'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422':
          description: Faltan datos obligatorios del cierre
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.tof.example/errores/regla
                title: No se puede cerrar el parte
                status: 422
                code: REGLA_NEGOCIO
                regla: RN-18
                detail: Faltan hora de salida y descripción de actuaciones.
                instance: /api/v1/guardias/7b2e9c14-0a6d-4c3b-9f51-2d8e7a1b6c40/parte

  /guardias/{guardiaId}/parte/validacion:
