        '409': {$ref: '#/components/responses/Conflicto'}
        '412': {$ref: '#/components/responses/VersionDesactualizada'}

  /cuadrantes/{anio}/{periodo}/publicacion:
    parameters:
      - $ref: '#/components/parameters/Anio'
      - $ref: '#/components/parameters/Periodo'
    post:
      tags: [Cuadrante]
      operationId: publicarCuadrante
      summary: Publica o modifica el cuadrante generando versión nueva
      description: |
        No se publica con huecos sin justificar (RN-09) ni sin la franja de detenido
        cubierta (RN-35). Si ya estaba publicado, la modificación crea versión nueva
        (RN-21) y conserva las anteriores (RN-22). Exige `If-Match` con el `ETag` leído.
      security: [{oauth2: [cuadrante.publish]}]
      x-roles: [coordinacion, admin]
      x-reglas: [RN-09, RN-21, RN-22, RN-35]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PublicacionRequest'}
      responses:
        '201':
          description: Versión publicada
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cuadrante'}
        '409':
          description: |
            Huecos sin justificar o franja de detenido descubierta. La respuesta lista las
            franjas afectadas para que la coordinación sepa qué corregir.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.tof.example/errores/regla
                title: No se puede publicar un cuadrante con huecos
                status: 409
                code: REGLA_NEGOCIO
                regla: RN-09
                franjas_afectadas:
                  - {guardia_id: 7b2e9c14-0a6d-4c3b-9f51-2d8e7a1b6c40, fecha: '2026-12-03', motivo: sin_titular}
                instance: /api/v1/cuadrantes/2026/12/publicacion
        '412': {$ref: '#/components/responses/VersionDesactualizada'}

